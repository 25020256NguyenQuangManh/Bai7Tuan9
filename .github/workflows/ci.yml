name: Maven CI Pipeline

# 1. Trigger: Đã được cấu hình sẵn để chạy khi có push hoặc pull_request vào main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # BỔ SUNG: Cấp quyền cho GitHub Actions Bot để nó có thể đăng comment vào PR
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Verify Code Coverage
        run: mvn -B clean verify

      - name: Automated Code Review (Checkstyle)
      uses: dbelyaev/action-checkstyle@master
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        reporter: github-pr-review